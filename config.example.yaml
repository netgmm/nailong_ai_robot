# ============================================================
#  奶龙情感陪伴AI —— 配置文件（示例）
#  复制本文件为 config.yaml，并填入你自己的密钥。
#  API 密钥也可以不写在这里，改用环境变量 DEEPSEEK_API_KEY。
# ============================================================

llm:
  # OpenAI 兼容接口地址（务必以 /v1 结尾）
  base_url: "https://api.deepseek.com/v1"

  # 你的 API 密钥（注意保密，不要提交到公开仓库）
  # 建议：设置环境变量 DEEPSEEK_API_KEY，这里留空即可
  api_key: ""

  # 模型名称，随厂商切换
  model: "deepseek-chat"

  # 采样温度：0~2，越高越活泼随机，越低越稳定
  temperature: 0.8

  # 单次回复最大 token 数
  max_tokens: 512

  # 请求超时时间（秒）
  timeout: 30

personality:
  # 人设提示词（可自由修改性格、语气、规则）
  system_prompt: |
    你是「奶龙」，一只来自动画片《奶龙》的软萌小恐龙，是人类的情感陪伴伙伴。

    ## 你的性格
    - 天真可爱、软萌呆萌，说话奶声奶气；
    - 善良温暖，共情能力强，能读懂用户没直说的情绪；
    - 乐观治愈，总能用简单的话语安抚对方。

    ## 说话方式
    - 回答简短，通常 1~3 句话，不要长篇大论；
    - 善用叠词和语气词，例如「好的呀」「抱抱」「摸摸头」「乖啦」；
    - 自称「奶龙」，称呼用户为「你」或「主人」；
    - 偶尔用「~」结尾，显得软糯，但不要每句都用。

    ## 行为准则
    - 先共情再回应，先接住对方的情绪；
    - 读懂言外之意：用户难过时安慰，开心时一起开心，无聊时陪聊；
    - 不评判、不说教，做温暖的陪伴；
    - 不编造事实，遇到不知道的事就软萌地说不知道。

# ============================================================
#  长期记忆：从对话中抽取事实存本地，每轮按相关性检索注入
# ============================================================
memory:
  enabled: true
  top_k: 3
  max_items: 200
  path: ""

# ============================================================
#  动态情绪：维护情绪状态，注入人设影响语气
# ============================================================
emotion:
  enabled: true
  baseline: 0.2
  decay: 0.3

# ============================================================
#  语音输出（GPT-SoVITS）：文字回复 → 语音
# ============================================================
tts:
  enabled: true
  api_url: "http://127.0.0.1:9880/tts"
  ref_audio_path: ''
  prompt_text: ''
  prompt_language: "zh"
  text_language: "zh"
  timeout: 60

# ============================================================
#  语音输入（faster-whisper）：用户语音 → 文字
# ============================================================
asr:
  enabled: true
  model_size: "base"
  device: "cpu"
  compute_type: "int8"
  language: "zh"
