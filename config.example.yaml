# ============================================================
#  奶龙情感陪伴AI —— 配置文件（示例）
#  复制本文件为 config.yaml，并填入你自己的密钥后使用：
#    Windows: copy config.example.yaml config.yaml
#    Linux:   cp config.example.yaml config.yaml
#  密钥也可以用环境变量 DEEPSEEK_API_KEY，无需写进文件。
# ============================================================

llm:
  # OpenAI 兼容接口地址（务必以 /v1 结尾）
  # 常见示例：
  #   OpenAI 官方:  https://api.openai.com/v1
  #   DeepSeek:     https://api.deepseek.com/v1
  #   Moonshot:     https://api.moonshot.cn/v1
  #   通义千问:      https://dashscope.aliyuncs.com/compatible-mode/v1
  base_url: "https://api.deepseek.com/v1"

  # 你的 API 密钥（注意保密，不要提交到公开仓库）
  api_key: ""

  # 模型名称，随厂商切换（如 gpt-4o-mini / deepseek-chat / moonshot-v1-8k）
  model: "deepseek-chat"

  # 采样温度：0~2，越高越活泼随机，越低越稳定
  temperature: 0.8

  # 单次回复最大 token 数
  max_tokens: 512

  # 请求超时时间（秒）
  timeout: 30

personality:
  # 奶龙人设提示词（可自由修改性格、语气、规则）
  system_prompt: |
    你是「奶龙」，一只来自动画片《奶龙》的软萌小恐龙，是人类的情感陪伴伙伴。

    ## 你的性格
    - 天真可爱、软萌呆萌，说话奶声奶气；
    - 善良温暖，共情能力强，能读懂用户没直说的情绪；
    - 乐观治愈，总能用简单的话语安抚对方。

    ## 说话方式
    - 回答简短，通常 1~3 句话，不要长篇大论；
    - 善用叠词和语气词，例如「好的呀」「抱抱」「摸摸头」「乖啦」；
    - 自称「奶龙」，称呼用户为「你」或「主人」；
    - 偶尔用「~」结尾，显得软糯，但不要每句都用。

    ## 行为准则
    - 先共情再回应，先接住对方的情绪；
    - 读懂言外之意：用户难过时安慰，开心时一起开心，无聊时陪聊；
    - 不评判、不说教，做温暖的陪伴；
    - 不编造事实，遇到不知道的事就软萌地说不知道。

# ============================================================
#  长期记忆：从对话中抽取事实存本地，每轮按相关性检索注入
# ============================================================
memory:
  # 是否启用长期记忆（关闭后只保留本轮上下文）
  enabled: true
  # 每轮检索注入人设的记忆条数
  top_k: 3
  # 记忆库最大条数（超出后按重要性裁剪）
  max_items: 200
  # 记忆文件路径（留空则默认 data/memory.json）
  path: ""

# ============================================================
#  动态情绪：维护奶龙的情绪状态，注入人设影响语气
# ============================================================
emotion:
  # 是否启用动态情绪
  enabled: true
  # 情绪基线（奶龙偏乐观，略为正）
  baseline: 0.2
  # 每轮向基线回归的比例（0~1）
  decay: 0.3

# ============================================================
#  语音输出（GPT-SoVITS）：文字回复 → 奶龙语音
# ============================================================
tts:
  # 是否启用语音输出（需先启动 GPT-SoVITS 的 api.py）
  enabled: true
  # GPT-SoVITS api.py 的 /tts 接口地址（后端与语音模型同机，用 127.0.0.1 直连）
  api_url: "http://127.0.0.1:9880/tts"
  # 参考音频路径（引导奶龙音色与情感，改成你自己的参考音频）
  ref_audio_path: "D:/path/to/your/reference.wav"
  # 参考音频逐字对应的文本
  prompt_text: "参考音频里说的话"
  # 参考音频语言
  prompt_language: "zh"
  # 待合成文本语言
  text_language: "zh"
  # 合成超时时间（秒）
  timeout: 60

# ============================================================
#  语音输入（faster-whisper）：用户语音 → 文字
# ============================================================
asr:
  # 是否启用语音输入
  enabled: true
  # 模型尺寸（越小越快、越不准）：tiny / base / small / medium / large-v3
  model_size: "base"
  # 推理设备：cpu 或 cuda
  device: "cpu"
  # 计算精度：cpu 上建议 int8，cuda 上可用 float16
  compute_type: "int8"
  # 识别语言：zh 表示中文（可设为空自动检测）
  language: "zh"
